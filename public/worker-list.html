<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worker List - Stitch Perfect</title>
  <!-- Bootstrap Icons for clean SVG graphics -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f4f9fd; height: 100vh; display: flex; overflow: hidden; color: #334155;">

  <!-- Left Sidebar (White) -->
  <aside style="width: 280px; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #e0f2fe; box-shadow: 2px 0 10px rgba(0,0,0,0.02); flex-shrink: 0; z-index: 10;">
    
    <div style="width: 100%;">
      <!-- Brand / Logo Area -->
      <div style="padding: 24px; border-bottom: 1px solid #e0f2fe; display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; background-color: #0ea5e9; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px;">✂</div>
        <span style="font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px;">Stitch Perfect</span>
      </div>

      <!-- Navigation Menu -->
      <nav style="display: flex; flex-direction: column; padding: 12px 0;">
        <a href="customer-enrolment.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-clipboard-check" style="font-size: 20px;"></i>
          <span>Customer Enrolment</span>
        </a>

        <a href="measurements.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-tape" style="font-size: 20px;"></i>
          <span>Measurements</span>
        </a>

        <a href="measurement-explorer.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-search" style="font-size: 20px;"></i>
          <span>Measurement Explorer</span>
        </a>

        <a href="worker-console.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-person-gear" style="font-size: 20px;"></i>
          <span>Worker Console</span>
        </a>

        <!-- Active Link -->
        <a href="worker-list.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #0284c7; font-size: 15px; font-weight: 600; background-color: #f0f9ff; border-left: 4px solid #0ea5e9;">
          <i class="bi bi-people" style="font-size: 20px;"></i>
          <span>Worker List</span>
        </a>

        <a href="ready-products.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-card-checklist" style="font-size: 20px;"></i>
          <span>Ready Products</span>
        </a>

        <a href="order-delivery.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-box-seam" style="font-size: 20px;"></i>
          <span>Order Delivery</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Actions (Info / Logout) -->
    <div style="display: flex; align-items: center; justify-content: space-around; padding: 24px; border-top: 1px solid #e0f2fe;">
      <a href="about.html" title="About" style="color: #94a3b8; text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#0284c7'" onmouseout="this.style.color='#94a3b8'">
        <i class="bi bi-info-circle" style="font-size: 24px;"></i>
      </a>
      <a href="login.html" title="Logout" style="color: #94a3b8; text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
        <i class="bi bi-box-arrow-right" style="font-size: 24px;"></i>
      </a>
    </div>

  </aside>

  <!-- Main Canvas Area -->
  <main style="flex: 1; display: flex; flex-direction: column; padding: 40px 50px; position: relative; overflow-y: auto;">
    
    <!-- Top Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 1px solid #e0f2fe; padding-bottom: 20px; margin-bottom: 30px;">
      <h1 style="margin: 0; font-size: 32px; font-weight: 600; color: #0f172a; letter-spacing: 0.5px;">Worker Roster</h1>
      
      <div style="display: flex; align-items: center; gap: 12px; border-left: 2px solid #e0f2fe; padding-left: 24px;">
        <div style="width: 40px; height: 40px; background-color: #0ea5e9; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 6px rgba(14,165,233,0.3);">
          <i class="bi bi-person-fill"></i>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Welcome</span>
          <span id="login-name" style="font-size: 16px; font-weight: 700; color: #0f172a;">xxx</span>
        </div>
      </div>
    </header>

    <!-- Main Content Panel -->
    <div style="display: flex; flex-direction: column; flex: 1;">
      
      <!-- Top Filters / Controls -->
      <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px; justify-content: center;">
        
        <!-- Dropdown Select -->
        <div style="position: relative;">
          <select id="workerSelect" style="width: 240px; height: 42px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 16px; font-size: 15px; appearance: none; background-color: #ffffff; outline: none; transition: 0.2s; cursor: pointer; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.02);" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.02)'">
            <option value="" disabled selected>Select Worker...</option>
            <option value="w1">Master Rajesh</option>
            <option value="w2">Kavita Devi</option>
            <option value="w3">Mohd. Irfan</option>
          </select>
          <i class="bi bi-caret-down-fill" style="position: absolute; right: 16px; top: 13px; color: #64748b; pointer-events: none; font-size: 12px;"></i>
        </div>

        <!-- All Worker Button -->
        <button type="button" style="background-color: #0ea5e9; color: #ffffff; border: none; border-radius: 6px; height: 42px; padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(14,165,233,0.2);" onmouseover="this.style.backgroundColor='#0284c7'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0ea5e9'; this.style.transform='translateY(0)'">
          All Worker
        </button>

      </div>

      <!-- Data Table Area (Empty State representation) -->
      <div style="background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
        
        <!-- Table Header Mockup -->
        <div style="background-color: #f1f5f9; border-bottom: 1px solid #cbd5e1; padding: 16px 20px; display: flex; align-items: center;">
          <!-- Empty header row matching the template visual -->
          <div style="height: 14px; background: linear-gradient(to bottom, #f8fafc, #e2e8f0); width: 100%; border-radius: 4px; opacity: 0.5;"></div>
        </div>

        <!-- Empty State Body -->
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; background-color: #ffffff;">
          <div style="text-align: center; color: #475569;">
            <i class="bi bi-table" style="font-size: 48px; color: #cbd5e1; margin-bottom: 16px; display: block;"></i>
            <span style="font-size: 18px; font-weight: 500;">No columns in table</span>
            <p style="font-size: 14px; color: #94a3b8; margin-top: 8px;">Select a worker or fetch data to populate the grid.</p>
          </div>
        </div>

      </div>

      <!-- Bottom Actions -->
      <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
        <button type="button" style="background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; height: 44px; padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(2,132,199,0.3); display: flex; align-items: center; gap: 8px;" onmouseover="this.style.backgroundColor='#0369a1'; this.style.transform='translateY(-1px)'" onmouseout="this.style.backgroundColor='#0284c7'; this.style.transform='translateY(0)'">
          <i class="bi bi-file-earmark-excel-fill" style="font-size: 18px;"></i>
          Export To Excel
        </button>
      </div>

    </div>

  </main>
</body>
</html>
