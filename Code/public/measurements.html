<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Measurements - Stitch Perfect</title>
  <!-- Bootstrap Icons for clean SVG graphics -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f4f9fd; height: 100vh; display: flex; overflow: hidden; color: #334155;">

  <!-- Left Sidebar (White) -->
  <aside style="width: 280px; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #e0f2fe; box-shadow: 2px 0 10px rgba(0,0,0,0.02); flex-shrink: 0; z-index: 10;">
    
    <div style="width: 100%;">
      <!-- Brand / Logo Area -->
      <div style="padding: 24px; border-bottom: 1px solid #e0f2fe; display: flex; align-items: center; gap: 12px;">
        <div style="width: 32px; height: 32px; background-color: #0ea5e9; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px;">✂</div>
        <span style="font-size: 20px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px;">Stitch Perfect</span>
      </div>

      <!-- Navigation Menu -->
      <nav style="display: flex; flex-direction: column; padding: 12px 0;">
        <a href="customer-enrolment.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-clipboard-check" style="font-size: 20px;"></i>
          <span>Customer Enrolment</span>
        </a>

        <!-- Active Link -->
        <a href="measurements.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #0284c7; font-size: 15px; font-weight: 600; background-color: #f0f9ff; border-left: 4px solid #0ea5e9;">
          <i class="bi bi-tape" style="font-size: 20px;"></i>
          <span>Measurements</span>
        </a>

        <a href="measurement-explorer.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-search" style="font-size: 20px;"></i>
          <span>Measurement Explorer</span>
        </a>

        <a href="worker-console.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-person-gear" style="font-size: 20px;"></i>
          <span>Worker Console</span>
        </a>

        <a href="worker-list.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-people" style="font-size: 20px;"></i>
          <span>Worker List</span>
        </a>

        <a href="ready-products.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-card-checklist" style="font-size: 20px;"></i>
          <span>Ready Products</span>
        </a>

        <a href="order-delivery.html" style="display: flex; align-items: center; gap: 14px; padding: 16px 24px; text-decoration: none; color: #475569; font-size: 15px; font-weight: 500; border-left: 4px solid transparent; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f0f9ff'; this.style.color='#0284c7'; this.style.borderLeft='4px solid #0ea5e9';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderLeft='4px solid transparent';">
          <i class="bi bi-box-seam" style="font-size: 20px;"></i>
          <span>Order Delivery</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Actions (Info / Logout) -->
    <div style="display: flex; align-items: center; justify-content: space-around; padding: 24px; border-top: 1px solid #e0f2fe;">
      <a href="about.html" title="About" style="color: #94a3b8; text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#0284c7'" onmouseout="this.style.color='#94a3b8'">
        <i class="bi bi-info-circle" style="font-size: 24px;"></i>
      </a>
      <a href="login.html" title="Logout" style="color: #94a3b8; text-decoration: none; transition: 0.2s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
        <i class="bi bi-box-arrow-right" style="font-size: 24px;"></i>
      </a>
    </div>

  </aside>

  <!-- Main Canvas Area -->
  <main style="flex: 1; display: flex; flex-direction: column; padding: 40px 50px; position: relative; overflow-y: auto; align-items: center;">
    
    <!-- Top Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 950px; border-bottom: 1px solid #e0f2fe; padding-bottom: 20px; margin-bottom: 30px;">
      <h1 style="margin: 0; font-size: 32px; font-weight: 600; color: #0f172a; letter-spacing: 0.5px;">Measurements</h1>
      
      <div style="display: flex; align-items: center; gap: 12px; border-left: 2px solid #e0f2fe; padding-left: 24px;">
        <div style="width: 40px; height: 40px; background-color: #0ea5e9; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 2px 6px rgba(14,165,233,0.3);">
          <i class="bi bi-person-fill"></i>
        </div>
        <div style="display: flex; flex-direction: column;">
          <span style="font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Welcome</span>
          <span id="login-name" style="font-size: 16px; font-weight: 700; color: #0f172a;">xxx</span>
        </div>
      </div>
    </header>

    <!-- Main Form Card -->
    <div style="background-color: #ffffff; border: 1px solid #bae6fd; border-radius: 12px; padding: 40px; box-shadow: 0 4px 12px rgba(186,230,253,0.3); width: 100%; max-width: 950px;">
      
      <form id="measurements-form">
        
        <!-- Top Section Grid -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 220px; gap: 32px; margin-bottom: 32px;">
          
          <!-- Column 1: Order Basics -->
          <div style="display: flex; flex-direction: column; gap: 20px;">
            <!-- Mobile No -->
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
              <label for="mobileNo" style="font-size: 15px; font-weight: 500; color: #334155; white-space: nowrap;">Mobile No.</label>
              <input type="tel" id="mobileNo" placeholder="Mobile" style="flex: 1; max-width: 200px; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; outline: none; transition: 0.2s;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
            </div>
            
            <!-- Dress -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <label for="dressType" style="font-size: 15px; font-weight: 500; color: #334155;">Dress</label>
              <div style="position: relative;">
                <select id="dressType" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; appearance: none; background-color: #ffffff; outline: none; cursor: pointer; color: #334155;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
                  <option value="" disabled selected>Dress</option>
                  <option value="suit">Suit</option>
                  <option value="shirt">Shirt</option>
                  <option value="trousers">Trousers</option>
                </select>
                <i class="bi bi-caret-down-fill" style="position: absolute; right: 12px; top: 11px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
              </div>
            </div>

            <!-- Date of Delivery -->
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <label for="deliveryDate" style="font-size: 15px; font-weight: 500; color: #334155;">Date of Delivery</label>
              <input type="date" id="deliveryDate" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; outline: none; transition: 0.2s; color: #64748b; box-sizing: border-box;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
            </div>
          </div>

          <!-- Column 2: Design Upload -->
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 16px; width: 100%; justify-content: center;">
              <span style="font-size: 16px; font-weight: 500; color: #334155;">Design</span>
              <button type="button" style="background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; height: 32px; padding: 0 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#0369a1'" onmouseout="this.style.backgroundColor='#0284c7'">
                Upload
              </button>
            </div>
            <!-- Fabric Weave Icon Placeholder -->
            <div style="font-size: 100px; color: #0ea5e9; opacity: 0.8; display: flex; align-items: center; justify-content: center; margin-top: -10px;">
              <i class="bi bi-grid-3x3-gap"></i>
            </div>
          </div>

          <!-- Column 3: Action Buttons Box -->
          <div style="border: 2px solid #e0f2fe; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 16px; background-color: #f8fafc;">
            <button type="button" style="background-color: #0ea5e9; color: #ffffff; border: none; border-radius: 6px; height: 42px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(14,165,233,0.2);" onmouseover="this.style.backgroundColor='#0284c7'" onmouseout="this.style.backgroundColor='#0ea5e9'">
              New
            </button>
            <button type="button" style="background-color: #0ea5e9; color: #ffffff; border: none; border-radius: 6px; height: 42px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(14,165,233,0.2);" onmouseover="this.style.backgroundColor='#0284c7'" onmouseout="this.style.backgroundColor='#0ea5e9'">
              Update
            </button>
            <button type="button" style="background-color: #ffffff; color: #475569; border: 1px solid #cbd5e1; border-radius: 6px; height: 42px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#f1f5f9'; this.style.color='#0f172a'" onmouseout="this.style.backgroundColor='#ffffff'; this.style.color='#475569'">
              Close
            </button>
          </div>

        </div>

        <!-- Middle Section: Billing -->
        <div style="display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px;">
          <!-- Quantity -->
          <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
            <label for="quantity" style="font-size: 15px; font-weight: 500; color: #334155;">Quantity</label>
            <div style="position: relative;">
              <select id="quantity" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; appearance: none; background-color: #ffffff; outline: none; cursor: pointer; color: #334155;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
                <option value="" disabled selected>Quantity</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
              </select>
              <i class="bi bi-caret-down-fill" style="position: absolute; right: 12px; top: 11px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
            </div>
          </div>

          <!-- Price Per Unit -->
          <div style="display: flex; flex-direction: column; gap: 8px; flex: 1;">
            <label for="pricePerUnit" style="font-size: 15px; font-weight: 500; color: #334155;">Price Per Unit</label>
            <input type="number" id="pricePerUnit" placeholder="Price per unit" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; outline: none; transition: 0.2s; box-sizing: border-box;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
          </div>

          <!-- Bill -->
          <div style="display: flex; flex-direction: column; gap: 8px; flex: 1.5;">
            <label for="totalBill" style="font-size: 15px; font-weight: 500; color: #334155;">Bill</label>
            <input type="text" id="totalBill" placeholder="Bill" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; outline: none; transition: 0.2s; background-color: #f8fafc; box-sizing: border-box;" readonly>
          </div>

          <!-- Calculate Button -->
          <button type="button" style="background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; height: 38px; padding: 0 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 4px rgba(2,132,199,0.2);" onmouseover="this.style.backgroundColor='#0369a1'" onmouseout="this.style.backgroundColor='#0284c7'">
            Calculate
          </button>
        </div>

        <!-- Divider line -->
        <hr style="border: 0; border-top: 1px solid #e0f2fe; margin: 32px 0;">

        <!-- Lower Section: Measurements -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
          
          <!-- Measurement Pick Row -->
          <div style="display: flex; align-items: center; gap: 16px;">
            <label for="measurementsSelect" style="font-size: 16px; font-weight: 500; color: #334155; margin-right: 8px;">Measurements</label>
            <div style="position: relative; width: 240px;">
              <select id="measurementsSelect" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; appearance: none; background-color: #ffffff; outline: none; cursor: pointer; color: #334155;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
                <option value="" disabled selected></option>
                <option value="profile1">Profile 1 (Standard Fit)</option>
                <option value="profile2">Profile 2 (Slim Fit)</option>
              </select>
              <i class="bi bi-caret-down-fill" style="position: absolute; right: 12px; top: 11px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
            </div>
            <button type="button" style="background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; height: 38px; padding: 0 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s;" onmouseover="this.style.backgroundColor='#0369a1'" onmouseout="this.style.backgroundColor='#0284c7'">
              Pick Existing Dress Measurement
            </button>
          </div>

          <!-- Measurements Text Area -->
          <textarea id="measurementsText" placeholder="Enter measurements" style="width: 100%; height: 160px; border-radius: 8px; border: 1px solid #cbd5e1; padding: 16px; font-size: 14px; font-family: inherit; outline: none; transition: 0.2s; resize: vertical; box-sizing: border-box;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'"></textarea>

          <!-- Workers Row -->
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="workersAssign" style="font-size: 16px; font-weight: 500; color: #334155;">Workers</label>
            <div style="position: relative; width: 240px;">
              <select id="workersAssign" style="width: 100%; height: 38px; border-radius: 6px; border: 1px solid #cbd5e1; padding: 0 12px; font-size: 14px; appearance: none; background-color: #ffffff; outline: none; cursor: pointer; color: #334155;" onfocus="this.style.borderColor='#0ea5e9'; this.style.boxShadow='0 0 0 3px rgba(14,165,233,0.1)'" onblur="this.style.borderColor='#cbd5e1'; this.style.boxShadow='none'">
                <option value="" disabled selected>Workers</option>
                <option value="w1">Master Rajesh</option>
                <option value="w2">Kavita Devi</option>
                <option value="w3">Mohd. Irfan</option>
              </select>
              <i class="bi bi-caret-down-fill" style="position: absolute; right: 12px; top: 11px; color: #64748b; font-size: 12px; pointer-events: none;"></i>
            </div>
          </div>
          
        </div>

      </form>
    </div>

  </main>
</body>
</html>
